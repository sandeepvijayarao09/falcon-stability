name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies (CPU torch)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock
          pip install --no-deps -e .
      - name: Unit tests (synthetic data, no download)
        run: pytest -q
      - name: Summary tables regenerate exactly from the committed result rows
        run: |
          python scripts/summarize.py --no-figures
          git diff --exit-code -- results/
