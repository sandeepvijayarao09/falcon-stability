name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Unit tests (synthetic data, no download)
        run: pytest -q
      - name: Results files are present and parse
        run: python -c "import pandas as pd; [pd.read_csv(f'results/{t}_test_rows.csv') for t in ('h1','m1')]"
